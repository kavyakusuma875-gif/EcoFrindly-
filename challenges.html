<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eco Challenges</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="main">

<h1>🌱 Eco Challenges</h1>

<p>Complete challenges and earn reward points!</p>

<div class="cards">

    <div class="card">

        <h3>🚶 Walk Instead of Driving</h3>

        <p>Earn 10 Points</p>

        <button class="challenge-btn" data-points="10">
            Complete
        </button>

    </div>

    <div class="card">

        <h3>♻ Recycle Plastic</h3>

        <p>Earn 15 Points</p>

        <button class="challenge-btn" data-points="15">
            Complete
        </button>

    </div>

    <div class="card">

        <h3>🌳 Plant a Tree</h3>

        <p>Earn 25 Points</p>

        <button class="challenge-btn" data-points="25">
            Complete
        </button>

    </div>

    <div class="card">

        <h3>🚯 Report Illegal Dumping</h3>

        <p>Earn 20 Points</p>

        <button class="challenge-btn" data-points="20">
            Complete
        </button>

    </div>

</div>

<a href="dashboard.html">

    <button style="margin-top:30px;width:250px;">
        ⬅ Back to Dashboard
    </button>

</a>

<script src="challenges.js"></script>

</body>
</html>
