<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - EcoFriendly+</title>

<link rel="stylesheet" href="style.css">

<style>

body{

    margin:0;

    font-family:Arial,Helvetica,sans-serif;

    background:linear-gradient(135deg,#27ae60,#2ecc71);

}

.login-container{

    width:380px;

    background:white;

    padding:35px;

    border-radius:15px;

    margin:80px auto;

    box-shadow:0 15px 40px rgba(0,0,0,.25);

}

.login-container h1{

    text-align:center;

    color:#27ae60;

}

.login-container p{

    text-align:center;

    color:#555;

    margin-bottom:25px;

}

.login-container input{

    width:100%;

    padding:12px;

    margin:10px 0;

    border:1px solid #ccc;

    border-radius:8px;

    font-size:16px;

    box-sizing:border-box;

}

.login-container button{

    width:100%;

    padding:13px;

    background:#27ae60;

    color:white;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-size:16px;

    margin-top:10px;

}

.login-container button:hover{

    background:#219150;

}

.login-container a{

    color:#27ae60;

    text-decoration:none;

}

.bottom{

    text-align:center;

    margin-top:20px;

}

</style>

</head>

<body>

<div class="login-container">

<h1>♻ EcoFriendly+</h1>

<p>Welcome Back</p>

<form id="loginForm">

<input
type="email"
id="loginEmail"
placeholder="Email"
required>

<input
type="password"
id="loginPassword"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

<div class="bottom">

Don't have an account?

<a href="signup.html">

Sign Up

</a>

</div>

</div>

<script src=""login.js"></script>

</body>
</html>
