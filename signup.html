<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up - EcoFriendly+</title>

<link rel="stylesheet" href="style.css">

<style>

body{

    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#27ae60,#2ecc71);

}

.signup-container{

    width:400px;
    background:white;
    padding:35px;
    margin:60px auto;
    border-radius:15px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);

}

.signup-container h1{

    text-align:center;
    color:#27ae60;

}

.signup-container p{

    text-align:center;
    color:#555;
    margin-bottom:25px;

}

.signup-container input{

    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;

}

.signup-container button{

    width:100%;
    padding:13px;
    background:#27ae60;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    margin-top:10px;

}

.signup-container button:hover{

    background:#219150;

}

.bottom{

    text-align:center;
    margin-top:20px;

}

.bottom a{

    color:#27ae60;
    text-decoration:none;

}

</style>

</head>

<body>

<div class="signup-container">

<h1>♻ EcoFriendly+</h1>

<p>Create Your Account</p>

<form id="signupForm">

<input
type="text"
id="name"
placeholder="Full Name"
required>

<input
type="email"
id="email"
placeholder="Email"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button type="submit">

Create Account

</button>

</form>

<div class="bottom">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</div>

<script>

document.getElementById("signupForm").addEventListener("submit", async(e)=>{

    e.preventDefault();

    const name=document.getElementById("name").value;

    const email=document.getElementById("email").value;

    const password=document.getElementById("password").value;

    try{

        const res=await fetch("https://ecofriendly-backend.onrender.com/api/auth/signup",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                name,
                email,
                password

            })

        });

        const data=await res.json();

        if(res.ok){

            alert("✅ Account Created Successfully");

            window.location.href="login.html";

        }

        else{

            alert(data.message);

        }

    }

    catch(error){

        console.log( "Signup Error:",error);

        alert("Server Error" + error.message);

    }

});

</script>

</body>
</html>
